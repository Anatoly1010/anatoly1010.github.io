{% include base_path %}

<li>
  <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time>
  <div class="panel-news__body">
    <a class="panel-news__title" href="{{ base_path }}{{ post.url }}">{{ post.title }}</a>
    {% if post.excerpt %}<span class="panel-news__detail">{{ post.excerpt | strip_html | normalize_whitespace | truncate: 160 }}</span>{% endif %}
  </div>
</li>
